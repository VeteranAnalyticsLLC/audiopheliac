name: Deploy The Audiopheliac Kit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:pages
        env:
          GITHUB_PAGES: "1"
          NITRO_PRESET: github_pages
          NITRO_APP_BASE_URL: /audiopheliac/
          VITE_PUBLIC_HOSTNAME: veterananalyticsllc.github.io
      - name: SPA fallback
        run: |
          if [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
